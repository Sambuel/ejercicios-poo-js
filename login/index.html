<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/295/295128.png" type="image/x-icon">

</head>
<body>

    <header>
        <h1 class="tituloPrincipal">Login</h1>
    </header>


    <!-- seccion numero 1  -->
    <main>
        <section class="cajaUno">
            <form class="formLogin">
                <h2 class="subtitulo">Iniciar Sesión</h2>
                <input id="inputUsuario" type="text" placeholder="Usuario">
                <input  id="inputPassword" type="password" placeholder="Contraseña">
                <button id="btnEntrar" type="submit">Entrar</button>
            </form>
        </section>

        <!-- seccion numero 2  -->

        <section class="cajaDos oculto">
            <form class="formLogin2">
                <h2 class="segundoSubtitulo">Cambiar contraseña</h2>
                <input id="inputActual" type="password" placeholder="Contraseña actual">
                <input  id="inputNueva" type="password" placeholder="Nueva contraseña">
                <button id="btnCambiar" type="submit">Cambiar</button>
            </form>
        </section>

        <p class="mensajeFinal"> </p>

    </main>




</body>
</html>
