<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafetera</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/5978/5978671.png" type="image/x-icon">
    
</head>
<body>

    <header>
        <h1>Cafetera ☕️</h1>
    </header>


    <main>


        <div class="medidas">
            <p>Agua: <span class="medidaAgua">1000</span> ml</p>
            <p>Café: <span class="medidaCafe">100</span> g</p>
        </div>

        <div class="btnsBebidas">
            <button id="btnAmericano">Americano</button>
            <button id="btnEspresso">Espresso</button>
        </div> 
        
        <div class="botonRellenar">
            <button id="btnRellenar">Rellenar</button>
        </div>

        <div class="lista">
            <ul class="contenedorListas">

            </ul>
        </div>

    </main>

</body>
</html>
